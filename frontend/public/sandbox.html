<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f172a; --bg2: #1e293b; --line: rgba(148,163,184,0.15);
    --fg: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --accent2: #818cf8;
    --user: #1d4ed8; --user2: #2563eb;
  }
  html, body { height: 100%; }
  body {
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
    overflow: hidden; font-size: 13px;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); background: var(--bg2); flex-shrink: 0;
  }
  .logo {
    width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    font-size: 13px; font-weight: 700; color: #0f172a; flex-shrink: 0;
  }
  .title { font-weight: 600; font-size: 13px; }
  .ctx-badge {
    font-size: 10.5px; color: var(--muted); background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.2); border-radius: 5px; padding: 1px 7px;
    max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sandbox-tag { font-size: 9.5px; color: #34d399; border: 1px solid rgba(52,211,153,0.3); border-radius: 4px; padding: 1px 5px; margin-left: auto; flex-shrink: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
  .msg { display: flex; gap: 8px; max-width: 92%; }
  .msg .copy-btn {
    opacity: 0; transition: opacity .15s ease; border: none; background: none;
    color: var(--muted); cursor: pointer; font-size: 10px; padding: 1px 5px; align-self: center;
  }
  .msg:hover .copy-btn { opacity: 1; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; font-size: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0f172a; font-weight: 700;
  }
  .msg.user .avatar { background: var(--user2); color: #fff; }
  .bubble {
    padding: 8px 11px; border-radius: 10px; line-height: 1.6; font-size: 12.5px;
    background: var(--bg2); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: linear-gradient(135deg, var(--user), var(--user2)); border: none; }
  .hint { color: var(--muted); font-size: 11px; text-align: center; padding: 6px 14px 2px; line-height: 1.7; }
  .hint code { background: rgba(148,163,184,0.15); padding: 0 5px; border-radius: 4px; }
  footer { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--bg2); flex-shrink: 0; }
  .input-row { display: flex; gap: 8px; }
  #input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg); padding: 8px 11px; font-size: 12.5px; outline: none; resize: none; max-height: 72px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0f172a;
    border: none; border-radius: 8px; padding: 0 16px; font-weight: 600; cursor: pointer; font-size: 12.5px;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { font-size: 10px; color: var(--muted); margin-top: 5px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 3px; }
  .streaming::after { content: '▌'; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <header>
    <div class="logo">H</div>
    <div class="title">Hermes</div>
    <div class="ctx-badge" id="ctxBadge" title="当前页面上下文">页面上下文: 未连接</div>
    <div class="sandbox-tag">SANDBOX</div>
  </header>
  <div class="hint">我能感知当前页面的元素与状态（路由 / 卡片 / 按钮 / 表格 / 关键数据），<br>可询问页面用法、数据含义或操作建议。<code>Enter</code> 发送</div>
  <div id="suggestions" style="display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;flex-shrink:0"></div>
  <div id="messages"></div>
  <footer>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="询问当前页面…"></textarea>
      <button id="send">发送</button>
    </div>
    <div id="status">Hermes · 沙盒运行中</div>
  </footer>

<script>
(function () {
  'use strict'
  var ctx = { route: '', pageTitle: '', state: {} }
  var msgsEl = document.getElementById('messages')
  var inputEl = document.getElementById('input')
  var sendEl = document.getElementById('send')
  var statusEl = document.getElementById('status')
  var ctxBadge = document.getElementById('ctxBadge')
  var streaming = false

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c] }) }

  function addMsg(role, text) {
    var div = document.createElement('div')
    div.className = 'msg ' + role
    div.innerHTML = '<div class="avatar">' + (role === 'user' ? 'U' : 'H') + '</div><div class="bubble"></div>'
    div.querySelector('.bubble').textContent = text
    var copyBtn = document.createElement('button')
    copyBtn.className = 'copy-btn'
    copyBtn.textContent = '复制'
    copyBtn.onclick = function () {
      try { navigator.clipboard.writeText(div.querySelector('.bubble').textContent); copyBtn.textContent = '已复制'; setTimeout(function(){ copyBtn.textContent = '复制' }, 1200) } catch (e) {}
    }
    div.appendChild(copyBtn)
    msgsEl.appendChild(div)
    msgsEl.scrollTop = msgsEl.scrollHeight
    return div.querySelector('.bubble')
  }

  function addHint() {
    addMsg('assistant', '你好，我是 Hermes。我已接入当前工作台沙盒，能读取页面上下文（当前页面、卡片、按钮、表格列、关键状态）。\n\n你可以问我，例如：\n· 这个页面怎么用？\n· 当前图表周期和数据是什么？\n· 这个按钮/区域是什么意思？\n· 下一步应该做什么？')
  }

  function updateCtx(newCtx) {
    if (!newCtx) return
    ctx = newCtx
    var label = (newCtx.pageTitle || newCtx.route || '未知页面')
    if (newCtx.state && newCtx.state.code) label += ' · ' + newCtx.state.code
    ctxBadge.textContent = '上下文: ' + label
    ctxBadge.title = JSON.stringify(newCtx).slice(0, 500)
    renderSuggestions(newCtx.suggestions)
  }

  function renderSuggestions(list) {
    var box = document.getElementById('suggestions')
    if (!box || !Array.isArray(list) || !list.length) return
    box.innerHTML = ''
    list.slice(0, 3).forEach(function (q) {
      var b = document.createElement('button')
      b.textContent = q
      b.style.cssText = 'background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);color:#7dd3fc;' +
        'border-radius:12px;font-size:10.5px;padding:2px 9px;cursor:pointer'
      b.onclick = function () { inputEl.value = q; inputEl.focus(); inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 72) + 'px' }
      box.appendChild(b)
    })
  }

  async function ask(question) {
    if (streaming) return
    streaming = true
    sendEl.disabled = true
    inputEl.disabled = true
    addMsg('user', question)
    var bubble = addMsg('assistant', '')
    bubble.classList.add('streaming')
    statusEl.textContent = 'Hermes 思考中…'
    var acc = ''
    try {
      var resp = await fetch('/api/v1/copilot/hermes/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, context: ctx }),
      })
      if (!resp.ok || !resp.body) {
        var errBody = await resp.text().catch(function () { return '' })
        bubble.textContent = '[请求失败 ' + resp.status + '] ' + errBody.slice(0, 200)
        statusEl.textContent = '请求失败'
      } else {
        var reader = resp.body.getReader()
        var decoder = new TextDecoder()
        var buf = ''
        while (true) {
          var r = await reader.read()
          if (r.done) break
          buf += decoder.decode(r.value, { stream: true })
          var lines = buf.split('\n\n')
          buf = lines.pop() || ''
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i]
            if (line.indexOf('data:') !== 0) continue
            var payload = line.slice(5).trim()
            if (payload === '[DONE]') continue
            try {
              var chunk = JSON.parse(payload)
              if (chunk.content) { acc += chunk.content; bubble.textContent = acc; msgsEl.scrollTop = msgsEl.scrollHeight }
            } catch (e) { /* 忽略 */ }
          }
        }
        if (!acc) bubble.textContent = '（无响应内容）'
        statusEl.textContent = 'Hermes · 沙盒运行中'
      }
    } catch (e) {
      bubble.textContent = '[连接错误] ' + String(e).slice(0, 150)
      statusEl.textContent = '连接错误'
    }
    bubble.classList.remove('streaming')
    streaming = false
    sendEl.disabled = false
    inputEl.disabled = false
    inputEl.focus()
  }

  sendEl.addEventListener('click', function () {
    var q = inputEl.value.trim()
    if (!q) return
    inputEl.value = ''
    inputEl.style.height = 'auto'
    ask(q)
  })
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendEl.click() }
  })
  inputEl.addEventListener('input', function () {
    this.style.height = 'auto'
    this.style.height = Math.min(this.scrollHeight, 72) + 'px'
  })

  window.addEventListener('message', function (e) {
    var d = e.data
    if (d && d.type === 'hermes-ctx') updateCtx(d.payload)
  })

  updateCtx({ route: location.pathname, pageTitle: 'Hermes 沙盒', state: {} })
  addHint()
})()
</script>
</body>
</html>
